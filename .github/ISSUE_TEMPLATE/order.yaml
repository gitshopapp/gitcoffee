# gitshop:order-template
name: "Order Fresh Coffee Beans"
description: "☕ Place your GitCoffee order for GITBLEND_V1"
title: "Order: GITBLEND_V1 - "
labels: ["gitshop:order", "gitshop:status:pending-payment"]
assignees: "odannyc"
body:
    - type: markdown
      attributes:
        value: |
          ### ☕ GitCoffee — GITBLEND_V1
          
          Fresh roasted to order and crafted for espresso + drip.
          
          #### What you’re getting
          * 12oz bag
          * $16 per bag
          * Light-to-medium roast
          * Origins: Ethiopia Yirgacheffe Natural, Burundi Kayanza, Colombia Pink Bourbon
          * Tasting notes: bright fruit, floral aromatics, sweet finish
          
          #### Shipping
          * Flat rate: $5 (US only)
          * Ships in 1–2 days
          
          After you submit, you’ll get a secure **Stripe Checkout** link to complete payment and shipping details. 🔐

    - type: dropdown
      id: product
      attributes:
        label: "Product"
        description: "Pick your coffee for this order. Right now we’re serving our flagship GitBlend V1 ☕"
        options:
            - GitBlend V1 (12oz) — $16.00 (SKU:GITBLEND_V1)
      validations:
        required: true
    - type: dropdown
      id: quantity
      attributes:
        label: Quantity
        description: "How many 12oz bags would you like?"
        options:
            - "1"
            - "2"
            - "3"
            - "4"
            - "5"
      validations:
        required: true
    - type: dropdown
      id: grind
      attributes:
        label: Grind
        description: "Choose your preferred grind. Note: Ground is typically the ideal size for drip/pour over."
        options:
            - Whole Bean
            - Ground
      validations:
        required: true
    - type: textarea
      id: order_notes
      attributes:
        label: "📝 Order Notes (optional)"
        description: "Add any brew preferences or notes for your order."
        placeholder: "Anything you'd like us to know?"
    - type: checkboxes
      id: confirmations
      attributes:
        label: "✅ Please confirm"
        options:
            - label: "I understand this coffee is roasted to order and ships in 1–2 days."
              required: true
            - label: "I understand shipping is a flat $5 (US only)."
              required: true
            - label: "I understand payment and shipping details are completed through secure Stripe checkout."
              required: true
